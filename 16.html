<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植田ゼミ ゼミ試ガイダンス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=DotGothic16&display=swap">
<style>
/* Layout: 生成AIのチャット画面。左＝チャット履歴（＝ガイダンスの章）、右＝Q&Aのスレッド、下＝次の質問が入った入力欄。→キーで1往復ずつ進む */
:root {
  --side: #F5F2FF;
  --bg: #FFFFFF;
  --primary: #6D28D9;
  --active: #EDE9FC;
  --accent: #0D9488;
  --ink: #1E1A29;
  --muted: #6B6480;
  --line: #E4DFF0;
  --code: #F7F5FB;
  --tbd-bg: #FFF4D6;
  --tbd-ink: #7A5200;
  --edge: #D3CAE6;
  --n1: #6D28D9; --n2: #0D9488; --n3: #C2410C; --n4: #2563EB;
  --star: #E8A400;
  /* 章ごとの色：サイドバーの色見本と本文の色をそろえ、今どの章かが一目で分かるようにする */
  --c0: #475569; --c1: #6D28D9; --c2: #0D9488; --c3: #2563EB; --c4: #C2410C; --c5: #BE185D; --c6: #15803D; --c7: #B45309; --c8: #4F46E5;
  /* 本文＝IBM Plex Sans JP（投影でも線が細くならない）、起動画面＝DotGothic16（ドット文字） */
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-code: "IBM Plex Mono", "Consolas", monospace;
  --font-display: "DotGothic16", var(--font-body);
  /* チャット画面はPCがダークモードでも常に白背景（起動画面だけは別に色を指定） */
  color-scheme: light;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  letter-spacing: .02em;
  /* 改行を文節の切れ目でする（「プロ／グラミング」のような途中改行を防ぐ。Chrome・Edgeで有効） */
  word-break: auto-phrase;
}
/* 見出し的な短い文字は字間を詰めて締まって見せる */
.chat-btn, .model, .brand-name, .ai-body th, .flow-step .t, .skill .t, .vt .what b, .mem .y, .tally-h, .rv-shop, .demo-btn, .bin-label, .composer-text b {
  font-feature-settings: "palt";
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.app {
  --sec: var(--c1);
  --sec-soft: color-mix(in srgb, var(--sec) 11%, var(--bg));
  --sec-line: color-mix(in srgb, var(--sec) 35%, var(--bg));
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  height: 100%;
}

/* ---- サイドバー ---- */
.side {
  background: var(--side);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 18px 12px 14px;
  gap: 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
}
.mark {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--bg);
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 15px;
  flex: none;
}
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.3; }

.side-label {
  font-size: 15px;
  color: var(--muted);
  padding: 0 10px;
  margin-bottom: 4px;
}
.chats {
  list-style: none;
  margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto;
  min-height: 0;
}
.chat-btn {
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 16px;
  line-height: 1.45;
  cursor: pointer;
  display: flex; gap: 8px; align-items: baseline;
}
.chat-btn:hover { background: color-mix(in srgb, var(--active) 60%, transparent); }
.chat-btn .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--k); flex: none; align-self: center; opacity: .55; }
.chat-btn[aria-current="true"] { background: color-mix(in srgb, var(--k) 13%, var(--side)); color: var(--k); font-weight: 700; }
.chat-btn[aria-current="true"] .sw { opacity: 1; }
.chat-btn .done { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 400; }

.side-foot {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 12px 10px 0;
  font-size: 15px;
  color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.who {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: var(--bg);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none;
}

/* ---- メイン ---- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  border-bottom: 2px solid var(--sec-line);
  transition: border-color .4s ease;
}
.model {
  font-weight: 700;
  font-size: 17px;
  display: flex; align-items: center; gap: 6px;
  min-width: 0;
}
.model .caret { color: var(--muted); font-weight: 400; font-size: 13px; }
.model .sec { color: var(--sec); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.kbd-hint { font-size: 15px; color: var(--muted); }
kbd {
  font-family: var(--font-code);
  font-size: 13px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
  background: var(--code);
}
.ghost {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 15px;
  cursor: pointer;
}
.ghost:hover { border-color: var(--primary); color: var(--primary); }

.thread {
  position: relative;
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding-block: 32px 24px;
  padding-inline: 24px;
}
.thread-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
/* 質問と回答の1往復。最新の往復は画面いっぱいの高さを確保し、質問を画面の上端に寄せられるようにする */
.ex { display: flex; flex-direction: column; gap: 28px; }
.ex:last-child { min-height: var(--pin-h, 0px); }

/* 回答の出し方：文章は1文字ずつ浮かび上がり、表・図は文章のあとに順番に出る（場所は最初から確保してガタつかせない） */
.ch { opacity: 0; transition: opacity .2s ease; }
.ch.on { opacity: 1; }
.wait { visibility: hidden; }
.appear { animation: appear .45s ease-out both; }
@keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.msg-user {
  align-self: flex-end;
  max-width: 78%;
  background: var(--sec-soft);
  border-radius: 20px 20px 6px 20px;
  padding: 10px 18px;
  font-size: 1.125rem;
}
.msg-ai {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 14px;
  font-size: 1.125rem;
}
.msg-ai .mark { width: 32px; height: 32px; margin-top: 2px; background: var(--sec); }
/* ゼミのマーク（きらめき）。サイドバーと回答の横で共通 */
.mark svg { width: 20px; height: 20px; fill: currentColor; display: block; }
.ai-body { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.ai-body p { margin: 0; }
.ai-body strong { color: var(--sec); font-weight: 700; }

.ai-body table {
  border-collapse: collapse;
  width: 100%;
  font-size: 1rem;
}
.table-wrap { overflow-x: auto; border: 1px solid var(--sec-line); border-radius: 10px; }
.ai-body th, .ai-body td {
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.ai-body tr:last-child td { border-bottom: 0; }
.ai-body th { font-size: 16px; color: var(--sec); font-weight: 700; background: var(--sec-soft); border-bottom-color: var(--sec-line); }
.ai-body td:first-child { font-weight: 700; }
.ai-body tr:nth-child(odd) td { background: color-mix(in srgb, var(--sec) 4%, var(--bg)); }

.ai-body ol, .ai-body ul { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.ai-body li::marker { color: var(--sec); font-weight: 700; }

.code {
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--code);
}
.code-head {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--muted);
  padding: 6px 14px;
  border-bottom: 1px solid var(--line);
}
.code pre {
  margin: 0;
  padding: 14px;
  overflow-x: auto;
  font-family: var(--font-code);
  font-size: 15px;
  line-height: 1.6;
}
.code .cm { color: var(--muted); }
.code .kw { color: var(--accent); }

.tbd {
  background: var(--tbd-bg);
  color: var(--tbd-ink);
  border: 1px dashed currentColor;
  border-radius: 4px;
  padding: 0 6px;
  font-size: 0.92em;
  white-space: nowrap;
}
.note { font-size: 0.95rem; color: var(--muted); }

.thinking { display: flex; gap: 5px; align-items: center; height: 32px; }
.thinking i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--primary);
  animation: blink 1s infinite ease-in-out;
}
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.enter { animation: rise .25s ease-out; }
@keyframes rise { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }


/* ---- 図・ビジュアル ---- */
.fig {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.figcap { font-size: 16px; color: var(--muted); line-height: 1.6; }
.sample-text { font-size: 1.05rem; background: var(--code); border-radius: 8px; padding: 10px 14px; }
.arrow-down { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 10px; font-size: 1rem; }
.chip.n { border-color: var(--n1); color: var(--n1); }
.chip.a { border-color: var(--n2); color: var(--n2); }
.legend-n { color: var(--n1); } .legend-a { color: var(--n2); }

.bars {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) 2.5em;
  gap: 8px 12px;
  align-items: center;
  font-size: 1rem;
}
.bar { height: 16px; background: var(--n1); border-radius: 0 4px 4px 0; display: block; }
.bars .v { font-variant-numeric: tabular-nums; color: var(--muted); }

.net-wrap { overflow-x: auto; }
.net { width: 100%; min-width: 460px; height: auto; display: block; }
.net .edges line { stroke: var(--edge); stroke-width: 2; }
.net circle { stroke: var(--bg); stroke-width: 2; }
.net .g1 { fill: var(--n1); } .net .g2 { fill: var(--n2); } .net .g3 { fill: var(--n3); } .net .g4 { fill: var(--n4); }
.net text { fill: var(--ink); font-size: 14px; text-anchor: middle; font-family: var(--font-body); }

.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.flow.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.flow-step {
  background: var(--sec-soft);
  border-radius: 10px;
  padding: 12px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
}
.flow-step .n {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--sec); color: var(--bg);
  display: grid; place-items: center;
  font-size: 14px; font-weight: 700;
}
.flow-step .t { font-weight: 700; font-size: 1.05rem; color: var(--sec); }
.flow-step .d { font-size: .9rem; color: var(--muted); line-height: 1.55; }
/* 生で話すパートの流れ（大きめのカード） */
.flow.big { gap: 18px; }
.flow.big .flow-step { padding: 22px 20px; gap: 8px; }
.flow.big .flow-step .n { width: 32px; height: 32px; font-size: 16px; }
.flow.big .flow-step .t { font-size: 1.5rem; }
.flow.big .flow-step .d { font-size: 1.05rem; }
.flow.big .flow-step:not(:last-child)::after { right: -14px; top: 50%; transform: translateY(-50%); font-size: 18px; }
.flow-step .tool { margin-top: auto; padding-top: 6px; font-size: 13px; color: var(--accent); font-weight: 500; }
.flow-step:not(:last-child)::after {
  content: "→";
  position: absolute; right: -9px; top: 14px;
  color: var(--muted); font-size: 14px;
}

.tl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tl { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 6px 3px; min-width: 700px; }
.tl .m { grid-row: 1; text-align: center; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.tl .b { --k: var(--sec); background: color-mix(in srgb, var(--k) 14%, var(--bg)); color: var(--k); border-radius: 6px; padding: 5px 10px; font-size: .9rem; font-weight: 500; line-height: 1.4; }
.tl .b.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.tl .b.short { padding: 5px 8px; white-space: nowrap; font-size: .85rem; justify-self: start; width: max-content; }
.tl .b.tbdb { background: var(--tbd-bg); color: var(--tbd-ink); border: 1px dashed currentColor; }

@media (max-width: 900px) {
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flow-step::after { display: none; }
}
@media (max-width: 480px) {
  .flow, .flow.three { grid-template-columns: minmax(0, 1fr); }
}


/* ---- クリックで進むデモ ---- */
.demo [hidden] { display: none !important; }
.demo-btn {
  align-self: flex-start;
  border: 1.5px solid var(--sec);
  color: var(--sec);
  background: var(--bg);
  border-radius: 8px;
  padding: 6px 16px;
  font-size: 16px; font-weight: 500;
  cursor: pointer;
}
.demo-btn:hover { background: var(--sec-soft); }
.demo-btn::after { content: " →"; }

/* 単語に分ける */
.sentence { font-size: 1.3rem; background: var(--code); border-radius: 8px; padding: 12px 16px; line-height: 2.1; }
.tok { transition: opacity .5s ease, background-color .4s ease, color .4s ease; border-radius: 4px; }
.s1 .tok:not(.p) { box-shadow: inset 0 0 0 1.5px var(--muted); padding: 0 .18em; margin: 0 .14em; }
.s2 .tok[data-to="n"] { background: color-mix(in srgb, var(--n1) 16%, transparent); color: var(--n1); font-weight: 700; }
.s2 .tok[data-to="v"] { background: color-mix(in srgb, var(--n2) 16%, transparent); color: var(--n2); font-weight: 700; }
.s2 .tok[data-to="a"] { background: color-mix(in srgb, var(--n3) 16%, transparent); color: var(--n3); font-weight: 700; }
.s2 .tok.x, .s2 .tok.p { opacity: .35; }
.s3 .tok { opacity: .3; }
.pos-legend { display: none; gap: 16px; font-size: 16px; font-weight: 500; }
.s2:not(.s3) .pos-legend { display: flex; }
.pos-legend span::before { content: "■ "; }
.pn { color: var(--n1); } .pv { color: var(--n2); } .pa { color: var(--n3); }
.bins { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
.bin {
  width: clamp(150px, 27%, 210px);
  max-width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid currentColor;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 18px; text-align: center;
}
.bin.n { color: var(--n1); background: color-mix(in srgb, var(--n1) 7%, transparent); }
.bin.v { color: var(--n2); background: color-mix(in srgb, var(--n2) 7%, transparent); }
.bin.a { color: var(--n3); background: color-mix(in srgb, var(--n3) 7%, transparent); }
.bin-label { font-weight: 700; font-size: 1rem; }
.bin-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.bin-items .chip { border-color: currentColor; color: var(--ink); background: var(--bg); font-size: 1.05rem; }

/* 口コミ画面 */
.rv-panel { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
/* 店名と評価を1行に並べて高さを抑える */
.rv-head { padding: 12px 18px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 16px; border-bottom: 1px solid var(--line); }
.rv-sort { grid-column: 1 / -1; }
.rv-shop { font-weight: 700; font-size: 1.15rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.rv-sample { font-size: 14px; font-weight: 400; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.rv-score { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--muted); }
.rv-num { font-size: 1.6rem; font-weight: 700; color: var(--ink); line-height: 1; }
.stars { position: relative; display: inline-block; font-size: 15px; letter-spacing: 1px; line-height: 1; color: var(--line); white-space: nowrap; }
.stars::before { content: "★★★★★"; }
.stars::after { content: "★★★★★"; position: absolute; left: 0; top: 0; width: calc(var(--r, 0) * 20%); overflow: hidden; color: var(--star); }
.rv-sort { display: flex; gap: 18px; font-size: 15px; color: var(--muted); overflow-x: auto; }
.rv-sort span { padding: 6px 0 8px; white-space: nowrap; }
.rv-sort .on { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: 500; }
.rv-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* 1件＝上段に名前と星、下段に本文 */
.rv { padding: 10px 18px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; min-width: 0; }
.rv:nth-child(odd) { border-right: 1px solid var(--line); }
.rv .stars { justify-self: end; }
/* 広い画面では3列にして、質問と口コミ画面が1画面に収まるようにする */
@media (min-width: 1100px) {
  .rv-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rv:nth-child(odd) { border-right: 0; }
  .rv:not(:nth-child(3n)) { border-right: 1px solid var(--line); }
}
.rv-who { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; }
.rv-ago { color: var(--muted); font-weight: 400; font-size: 15px; }
.av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--bg); flex: none; }
.av.c1 { background: var(--n1); } .av.c2 { background: var(--n2); } .av.c3 { background: var(--n3); } .av.c4 { background: var(--n4); }
.rv p { grid-column: 1 / -1; margin: 0; font-size: 1rem; line-height: 1.65; }
.nb { white-space: nowrap; }
.rv mark { background: transparent; color: inherit; border-radius: 3px; transition: background-color .4s ease, color .4s ease; }
.s1 .rv mark.k { background: color-mix(in srgb, var(--n1) 15%, transparent); color: var(--n1); font-weight: 700; }
.s3 .rv mark.k:not(.c) { background: transparent; color: inherit; font-weight: inherit; }
.s3 .rv mark.c { background: color-mix(in srgb, var(--n3) 18%, transparent); color: var(--n3); }
.rv-more { padding: 8px 18px; font-size: 15px; color: var(--muted); text-align: center; }
.review-demo { position: relative; }
.fly { position: absolute; z-index: 3; pointer-events: none; white-space: nowrap; font-size: 1rem; line-height: 1.65; font-weight: 700; border-radius: 3px; color: var(--n1); background: color-mix(in srgb, var(--n1) 15%, var(--bg)); }
.tally { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tally-col { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tally-h { font-weight: 700; font-size: 16px; }
.tally .bad .bar { background: var(--n3); }
.s3 .tally .bad { border-color: var(--n3); box-shadow: 0 0 0 1px var(--n3) inset; }
.conclusion { font-size: 1.2rem; font-weight: 500; }
.conclusion strong { color: var(--n3) !important; }

const secColor = (i) => (SECTIONS[i].live ? "var(--c0)" : `var(--c${i})`);

function buildSidebar() {
  chatsEl.innerHTML = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chat-btn";
    b.style.setProperty("--k", secColor(i));
    b.innerHTML = `<span class="sw" aria-hidden="true"></span><span>${s.title}</span>` + (i < cur ? `<span class="done">済</span>` : "");
    if (i === cur) b.setAttribute("aria-current", "true");

}

function demoLabels(fig) { return fig.dataset.labels.split("|"); }
function demoStep(fig) { return Number(fig.dataset.step || 0); }

  return [...inner.querySelectorAll(".demo")].find((f) => demoStep(f) < demoLabels(f).length) || null;
}
function show(el, animate) {
  if (!el || !el.hidden) return;
  el.hidden = false;
  if (animate && !reduceMotion) { el.classList.remove("fade-in"); el.offsetWidth; el.classList.add("fade-in"); }
}
function flyToBins(fig, animate) {
  const bins = fig.querySelector(".bins");
  if (bins.dataset.filled) return;
  bins.dataset.filled = "1";
  bins.hidden = false;
  const moves = [];
  fig.querySelectorAll(".tok[data-to]").forEach((tok, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = tok.dataset.base;
    fig.querySelector(`.bin-items[data-k="${tok.dataset.to}"]`).appendChild(chip);
    moves.push({ tok, chip, i });
  });
  if (!animate || reduceMotion) return;
  moves.forEach(({ tok, chip }) => {
    const f = tok.getBoundingClientRect(), l = chip.getBoundingClientRect();
    chip.style.transition = "none";
    chip.style.transform = `translate(${f.left - l.left}px, ${f.top - l.top}px)`;
  });
  fig.offsetWidth;
  moves.forEach(({ chip, i }) => {
    chip.style.transition = `transform .8s cubic-bezier(.2,.8,.2,1) ${i * 0.07}s`;
    chip.style.transform = "";
  });
}
/* 口コミの色付き単語が、下のランキングの同じ言葉へ飛んでいき、着いたら棒が伸びる */
const BASE_FORM = { 混んで: "混む", 混雑: "混む", 待った: "待つ" };
function flyToTally(fig, animate) {
  const tally = fig.querySelector(".tally");
  if (!tally.hidden) return;
  tally.hidden = false;
  if (!animate || reduceMotion) return;
  const labels = [...tally.querySelectorAll(".bars > span:not([class])")];
  const bars = [...tally.querySelectorAll(".bar")], vals = [...tally.querySelectorAll(".bars .v")];
  // はじめは空のランキング（言葉と数字は透明、棒の長さは0）
  [...labels, ...vals].forEach((e) => (e.style.opacity = "0"));
  bars.forEach((b) => { b.dataset.w = b.style.width; b.style.transition = "none"; b.style.width = "0"; });
  const fr = fig.getBoundingClientRect(), cs = getComputedStyle(fig);
  const purple = cs.getPropertyValue("--n1").trim(), orange = cs.getPropertyValue("--n3").trim();
  const look = (col) => ({ color: col, backgroundColor: col + "26" });
  let n = 0;
  fig.querySelectorAll(".rv mark.k").forEach((mk) => {
    const lab = labels.find((l) => l.textContent === (BASE_FORM[mk.textContent] || mk.textContent));
    if (!lab) return;
    const m = mk.getBoundingClientRect(), l = lab.getBoundingClientRect();
    const c = document.createElement("span");
    c.className = "fly";
    const col = lab.closest(".bad") ? orange : purple; // ★1〜2側へ行く言葉は飛びながらオレンジに変わる
    c.textContent = mk.textContent;
    c.style.left = `${m.left - fr.left}px`;
    c.style.top = `${m.top - fr.top}px`;
    fig.appendChild(c);
    const delay = n++ * 90, to = `translate(${l.left - m.left}px, ${l.top - m.top}px)`;
    const timing = { duration: 900, delay, fill: "both" };
    c.animate([{ transform: "none", ...look(purple) }, { transform: to, ...look(col) }], { ...timing, easing: "cubic-bezier(.3,.7,.2,1)" });
    c.animate([{ opacity: 1 }, { opacity: 1, offset: 0.55 }, { opacity: 0 }], timing).onfinish = () => c.remove();
  });
  // ランキングの言葉は、どの単語がいつ着くかに関係なく、全部いっしょに0→100%へゆっくり現れる
  const total = (n - 1) * 90 + 900;
  setTimeout(() => labels.forEach((l) => { l.style.transition = `opacity ${total - 400}ms ease`; l.style.opacity = "1"; }), 400);
  setTimeout(() => {
    bars.forEach((b, i) => { b.style.transition = `width .7s cubic-bezier(.2,.8,.2,1) ${(i % 4) * 0.08}s`; b.style.width = b.dataset.w; });
    vals.forEach((v) => { v.style.transition = "opacity .3s .5s"; v.style.opacity = "1"; });
  }, total);
}
function applyDemo(fig, n, animate) {
  fig.dataset.step = n;
  for (let i = 1; i <= 3; i++) fig.classList.toggle("s" + i, n >= i);
  const kind = fig.dataset.kind;
  if (kind === "split" && n >= 3) flyToBins(fig, animate);
  if (kind === "review") {
    if (n >= 2) flyToTally(fig, animate);
    if (n >= 3) { show(fig.querySelector(".conclusion"), animate); show(fig.querySelector(".takeaway"), animate); }
  }
  const labels = demoLabels(fig), btn = fig.querySelector(".demo-btn");
  if (n < labels.length) btn.textContent = labels[n]; else btn.hidden = true;
  if (animate) {
    // 新しく出てきた部分が画面外なら、そこが見えるところまでだけスクロールする
    const added = kind === "split" && n >= 3 ? fig.querySelector(".bins")
      : kind === "review" && n >= 3 ? fig.querySelector(".takeaway")
      : kind === "review" && n >= 2 ? fig.querySelector(".tally")
      : fig;
    keepVisible(added);
  }
}
function advanceDemo(fig) {
  if (!fig) return false;
  applyDemo(fig, demoStep(fig) + 1, true);

}
function initDemos(root, finished) {
  root.querySelectorAll(".demo").forEach((f) => applyDemo(f, finished ? demoLabels(f).length : 0, false));
}
inner.addEventListener("click", (e) => {

function stopAll() {

function exchangeEl(ex) {

/* 最新の往復が画面いっぱいの高さを持てるようにする（質問を上端に寄せるため） */
function fitPin() {
  const cs = getComputedStyle(thread);
  // 端数で余計なスクロールバーが出ないよう1px余裕をもたせる
  inner.style.setProperty("--pin-h", `${Math.floor(thread.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)) - 1}px`);
}
window.addEventListener("resize", fitPin);

/* ゆっくりスクロール：dur ミリ秒かけて、加速→減速しながら top まで動かす（0なら瞬時） */
const PIN_MS = 1000, FOLLOW_MS = 700;
let glide = null, glideTarget = 0;
function glideTo(top, dur) {
  if (glide) { cancelAnimationFrame(glide); glide = null; }
  top = Math.max(0, Math.min(top, thread.scrollHeight - thread.clientHeight));
  const from = thread.scrollTop, d = top - from;
  if (reduceMotion || !dur || Math.abs(d) < 1) { thread.scrollTop = top; return; }
  glideTarget = top;
  const t0 = performance.now(), ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const step = (now) => {
    const x = Math.min(1, (now - t0) / dur);
    thread.scrollTop = from + d * ease(x);
    glide = x < 1 ? requestAnimationFrame(step) : null;
  };
  glide = requestAnimationFrame(step);
}
// 発表者がホイールで動かしたら、自動スクロールはやめる
thread.addEventListener("wheel", () => { if (glide) { cancelAnimationFrame(glide); glide = null; } }, { passive: true });
const scrollGoal = () => (glide ? glideTarget : thread.scrollTop);

/* 指定した往復の質問を画面の上端に寄せる */
function pinTop(el, smooth) {
  if (!el) return;
  glideTo(el.offsetTop - 20, smooth ? PIN_MS : 0);
}

/* 要素の下端が画面外なら、要素の上端が隠れない範囲でスクロールして見せる（進行中のスクロールの行き先を基準に計算） */
function keepVisible(el) {
  if (!el) return;
  const ahead = scrollGoal() - thread.scrollTop;
  const tr = thread.getBoundingClientRect(), r = el.getBoundingClientRect();
  const by = Math.min(r.bottom - ahead - (tr.bottom - 12), r.top - ahead - (tr.top + 12));
  if (by > 0) glideTo(scrollGoal() + by, FOLLOW_MS);
}

function render(animateLast) {
  stopAll();
  const sec = SECTIONS[cur];
  $("secTitle").textContent = sec.title;
  document.querySelector(".app").style.setProperty("--sec", secColor(cur));
  fitPin();
  inner.innerHTML = "";
  const upto = animateLast ? step - 1 : step;
  for (let i = 0; i < upto; i++) inner.appendChild(exchangeEl(sec.ex[i]));
  initDemos(inner, true);
  buildSidebar();
  if (animateLast && step > 0) playExchange(sec.ex[step - 1]);
  else glideTo(0, 0);
  updateComposer();
}

function playExchange(ex) {
  const w = document.createElement("div");
  w.className = "ex";
  const u = userMsg(ex.q);
  u.classList.add("enter");
  const think = document.createElement("div");
  think.className = "msg-ai";
  think.innerHTML = `<div class="mark" aria-hidden="true">${IC.ai}</div><div class="thinking" aria-label="回答を作成中"><i></i><i></i><i></i></div>`;
  w.append(u, think);
  inner.appendChild(w);
  pinTop(w, true);
  const go = () => {
    thinkTimer = null;
    const m = aiMsg(ex.a);
    think.replaceWith(m);
    updateComposer();
    if (reduceMotion) return;
    revealAnswer(m.querySelector(".ai-body"));
  };
  if (reduceMotion) go(); else thinkTimer = setTimeout(go, 500);
}

/* 回答を順番に見せる：文章（p）は1文字ずつ、表・図・カードはそのあとに1つずつ */
const CHAR_MS = 28, UNIT_GAP = 160, STAGGER = ".vt, .skills, .members, .flow";
function splitChars(p) {
  const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  const texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  const chars = [];
  texts.forEach((t) => {
    const frag = document.createDocumentFragment();
    for (const c of t.nodeValue) {
      const sp = document.createElement("span");
      sp.className = "ch";
      sp.textContent = c;
      frag.appendChild(sp);
      chars.push(sp);
    }
    t.replaceWith(frag);
  });
  return chars;
}
function revealAnswer(body) {
  const steps = [];
  [...body.children].forEach((el) => {
    if (el.tagName === "P" && !el.classList.contains("note")) { steps.push({ chars: splitChars(el) }); return; }
    (el.matches(STAGGER) ? [...el.children] : [el]).forEach((u) => { u.classList.add("wait"); steps.push({ unit: u }); });
  });
  let i = 0, timer = null, done = false;
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    steps.forEach((st) => (st.chars ? st.chars.forEach((c) => c.classList.add("on")) : st.unit.classList.remove("wait")));
    streaming = null;
  };
  const run = () => {
    if (i >= steps.length) { finish(); return; }
    const st = steps[i++];
    if (st.unit) {
      st.unit.classList.remove("wait");
      st.unit.classList.add("appear");
      keepVisible(st.unit);
      timer = setTimeout(run, UNIT_GAP);
      return;
    }
    const t0 = performance.now();
    let n = 0;
    const tick = () => {
      const want = Math.min(st.chars.length, Math.floor((performance.now() - t0) / CHAR_MS) + 1);
      while (n < want) st.chars[n++].classList.add("on");
      timer = setTimeout(n < st.chars.length ? tick : run, n < st.chars.length ? 16 : 120);
    };
    tick();
  };
  streaming = { finish };
  run();
}

function updateComposer() {
  const sec = SECTIONS[cur];
  const c = $("composer"), t = $("composerText");
  c.dataset.end = "false";
  const pd = pendingDemo();
  if (pd) {
    t.innerHTML = `<b></b>`;
    t.firstChild.textContent = demoLabels(pd)[demoStep(pd)];
  } else if (step < sec.ex.length) {
    t.innerHTML = `<b></b>`;
    t.firstChild.textContent = sec.ex[step].q;
  } else if (cur < SECTIONS.length - 1) {
    t.innerHTML = `次のチャット「<b></b>」へ`;
    t.querySelector("b").textContent = SECTIONS[cur + 1].title;
  } else {
    t.textContent = "ガイダンスは以上です。ありがとうございました。";
    c.dataset.end = "true";
  }
}

function next() {
  if (thinkTimer || streaming) {
    // 再生中なら最後まで一気に表示
    if (thinkTimer) {
      clearTimeout(thinkTimer); thinkTimer = null;
      render(false);
      if (inner.lastElementChild) initDemos(inner.lastElementChild, false);
      updateComposer();
      pinTop(inner.lastElementChild, false);
    } else streaming.finish();
    return;
  }
  if (advanceDemo(pendingDemo())) return;
  const sec = SECTIONS[cur];
  if (step < sec.ex.length) { step++; render(true); }
  else if (cur < SECTIONS.length - 1) { cur++; step = 1; render(true); }
}

function prev() {
  stopAll();
  if (step > 1) { step--; render(false); pinTop(inner.lastElementChild, false); }
  else if (cur > 0) { cur--; step = SECTIONS[cur].ex.length; render(false); pinTop(inner.lastElementChild, false); }
}

function jump(i) { cur = i; step = 1; render(true); }

/* ---- 起動画面 ---- */
const boot = $("boot");
let bootStage = 0, typing = null;
function typeWelcome() {}

function showBootStage(n, instant) {
  bootStage = n;
  $("bootTitle").dataset.off = n === 0 ? "false" : "true";
  $("bootWelcome").dataset.off = n === 1 ? "false" : "true";
  $("bootHint").textContent = "PRESS TO START";
  if (n === 1) typeWelcome(instant);
}

function advanceBoot() {
  if (typing) { typeWelcome(true); return; }
  if (bootStage === 0) showBootStage(1);
  else finishBoot();
}

function finishBoot() {
  bootStage = 2;
  boot.classList.add("leaving");
  setTimeout(() => { boot.hidden = true; }, reduceMotion ? 0 : 600);
  cur = 0; step = 1;
  render(true);
}

function reopenBoot() {
  stopAll();
  boot.hidden = false;
  boot.classList.remove("leaving");
  showBootStage(1, true);
}

boot.addEventListener("click", advanceBoot);

$("composer").addEventListener("click", next);
$("allBtn").addEventListener("click", () => { step = SECTIONS[cur].ex.length; render(false); initDemos(inner, true); updateComposer(); });

document.addEventListener("keydown", (e) => {
  const fwd = ["ArrowRight", "PageDown", " ", "Enter"].includes(e.key);
  const back = ["ArrowLeft", "PageUp"].includes(e.key);
  if (bootStage < 2) {
    if (fwd) { e.preventDefault(); advanceBoot(); }
    else if (back && bootStage === 1) { e.preventDefault(); if (typing) typeWelcome(true); showBootStage(0); }
    return;
  }
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (fwd) { e.preventDefault(); next(); }
  else if (back) {
    e.preventDefault();
    if (cur === 0 && step <= 1) reopenBoot(); else prev();
  }
});

render(false);
</script>
